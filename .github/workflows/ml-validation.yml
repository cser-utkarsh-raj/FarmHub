name: FarmHub ML validation

on:
  workflow_dispatch:
    inputs:
      commodity:
        description: "Commodity to fetch for this training run"
        required: true
        default: "Potato"

jobs:
  ml-validation:
    runs-on: ubuntu-latest
    env:
      DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend and ML dependencies
        run: pip install -r backend/requirements.txt

      - name: Fetch fresh Bihar mandi data
        run: |
          python backend/ml/scripts/data_ingestion.py             --dataset mandi             --commodity "${{ inputs.commodity }}"             --max-pages 200

      - name: Verify provenance
        run: |
          test -f backend/ml/data/provenance/mandi.json
          python - <<'PY'
          from backend.ml.provenance import Provenance
          p = Provenance.load("backend/ml/data/provenance/mandi.json")
          assert p.source == "data.gov.in"
          assert p.source_resource_id == "9ef84268-d588-465a-a308-a864a43d0070"
          assert p.row_count > 0
          print("Rows:", p.row_count)
          print("Date range:", p.date_min, "->", p.date_max)
          PY

      - name: Run ML tests
        run: python -m pytest backend/ml/tests -q

      - name: Train model
        run: python backend/ml/scripts/train.py

      - name: Run chronological backtest
        run: python backend/ml/scripts/backtest.py

      - name: Upload ML outputs
        uses: actions/upload-artifact@v4
        with:
          name: farmhub-ml-${{ inputs.commodity }}
          path: |
            backend/ml/reports/
            backend/ml/models/
