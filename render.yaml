services:
  - type: web
    name: shennong-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PROJECT_NAME
        value: Shennong API
      - key: API_V1_STR
        value: /api
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://shennong-dot.vercel.app,https://farmhub-dot.vercel.app
      - key: DATA_GOV_IN_API_KEY
        sync: false
      - key: MANDI_INGESTION_KEY
        sync: false
      - key: FARMHUB_ML_MODEL_PATH
        value: /app/backend/ml/models/price_forecaster.joblib

  - type: cron
    name: shennong-mandi-sync
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    schedule: "30 13 * * *"
    dockerCommand: python backend/scripts/sync_mandi.py
    envVars:
      - key: DATA_GOV_IN_API_KEY
        sync: false
      - key: MANDI_INGESTION_KEY
        sync: false
      - key: FARMHUB_API_URL
        fromService:
          name: shennong-api
          type: web
          property: hostport
